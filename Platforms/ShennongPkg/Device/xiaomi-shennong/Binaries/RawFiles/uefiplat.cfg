[ConfigParameters]
# Update count if more than default 30 entries
ConfigParameterCount = 64

## UEFI CORE
PlatConfigFileName = "uefiplatLA.cfg"
OsTypeString = "LA"

# Force booting to shell whilst in pre-silicon phase
EnableShell = 0x1

# Tune based on Sec heap needs for FV decompression and MMU tables through Dxe/BDS
SecPagePoolCount = 0x800

# Shared IMEM (Cookies, Offsets)
SharedIMEMBaseAddr    = 0x14680000
#
# OverRideSharedImemBootCfg was absent, and QcomLib's GetSharedImemBootDeviceType()
# reads it right after SharedIMEMBaseAddr. The log shows one Success and one Not
# Found from the same caller, and RpmbListener.c +160 asserts !EFI_ERROR(Status) on
# what that helper returns.
#
# 0 is a guess and should be treated as one: the usual meaning of an OverRide key is
# 'when non-zero, use this instead of the hardware value', so 0 should leave the
# hardware-derived boot device type in charge. If the assert persists, the value is
# being interpreted as a device type and needs the real encoding rather than 0.
#
OverRideSharedImemBootCfg = 0
#
# Present as 0x1 in public Qualcomm ports; absent here. Gates automatic firmware
# image loading, and this port still fails to load the GPIO firmware.
#
LoadAutoImageInPILFlag = 0x1
#
# ScmDxeCompat asks for this by name at entry, and it is not in any config file
# this platform ships - neither here nor in the stock uefiplat.cfg. Without it
# the lookup returns NOT_FOUND, the driver sizes its SMC argument buffer from
# three zero bitfields, AllocatePool(0) returns NULL, and its own
# ASSERT_EFI_ERROR turns that into a dead loop. That dead loop is the "hang" that
# got ScmDxeCompat removed from this build in the first place.
#
# The three fields are the buffer sizes, taken as
#   bits[31:21], bits[20:10], bits[9:0]
# and 0x20040100 sets all three to 0x100, which is the shape a deliberate value
# has: one size repeated in every field. Anything with a zero field puts the
# driver straight back into the zero-length allocation.
#
# The reverse of ScmDxeCompat.efi (reverse/src/ScmDxeCompat.c) confirms the
# consumer: the SMC ABI packs {SmcId, argument buffer physical address, 8} into
# x1..x3, so the buffer is real memory the driver allocates once and reuses.
#
SmcInvokeConfig = 0x20040100
#
# Absent here but present as 8 in public SM8650 ports. SecProtocolFinderLib
# looks this up by name (LocateConfigurationMapUINT32ByName("MaxCoreCnt", ...))
# and a failed lookup leaves the core count to a default we do not control.
#
MaxCoreCnt = 8
EnableSecurityHoleForSplashPartition = 0x1
DloadCookieAddr = 0x01FD9000
# for full dump 0x10, for minidump 0x20
DloadCookieValue = 0x10

# Skip dbi setup
SkipDBISetup = 0x0

# debug cookie of PIL subsystem, defined in FBC script
PilSubsysDbgCookieAddr = 0x146806DC
PilSubsysDbgCookieVal = 0x53444247

# NumCpus - max number of cores
NumCpus = 8
# NumActiveCores - number of cores used
NumActiveCores = 8

## ULogFile
SpecialLogPartition = "LOGFS:\"
MaxLogFileSize = 0x400000

# UEFI memory use
UefiMemUseThreshold = 0xE1

## USB ##
USBHS1_Config = 0x0
UsbFnIoRevNum = 0x00010001

## Buttons / KeyPad ##
PwrBtnShutdownFlag = 0x0

## SDCC ##
Sdc1GpioConfigOn = 0x1E92
Sdc2GpioConfigOn = 0x1E92
Sdc1GpioConfigOff = 0xA00
Sdc2GpioConfigOff = 0xA00

## SDHC Mode 0:Legacy Mode, Non-zero: SDHC Mode ##
EnableSDHCSwitch = 0x1

## UFS
EnableUfsIOC = 1
UfsSmmuConfigForOtherBootDev = 1
#
# LinkStartupRetryCount was missing entirely. UFSDxe reads it by name and, with the
# key absent, the boot stops after the config reads and before the first
# 'UFS Speed: Gear ...' line - no error, no assert, just silence, which is what an
# unbounded retry loop looks like from the console. A small count turns that into a
# reported failure instead.
#
LinkStartupRetryCount = 3

## PCIE
## PCIeRPNumber BIT 7:0  -> number of RPs to be enabled
## PCIeRPNumber BIT 15:8 -> BIT mask to identify which RPs are enabled
## Eg. value: 0x0502     -> Total two numbers of RPs, RP0 and RP2 are enabled
## Total RPs supported 8 numbers and bits allocated are 16 bits
#PCIeRPNumber=0x0101

## Security flag ##
SecurityFlag = 0xC4
# SecBootEnableFlag = 0x1               i.e. 0b00000001
# TreeTpmEnableFlag = 0x2               i.e. 0b00000010
# CommonMbnLoadFlag = 0x4               i.e. 0b00000100
# DxHdcp2LoadFlag = 0x8                 i.e. 0b00001000
# VariableServicesFlag = 0x10           i.e. 0b00010000
# WinsecappFlag = 0x20                  i.e. 0b00100000
# LoadSecAppFlag = 0x40                 i.e. 0b01000000
# LoadKeymasterFlag = 0x80              i.e. 0b10000000
# EnableQseeLogsFlag = 0x100            i.e. 0b 00000001 00000000

## Default app to boot in platform BDS init
DefaultChargerApp = "QcomChargerApp"
DefaultBDSBootApp = "LinuxLoader"

## Enable HotKey detection in RETAIL devices
DetectRetailUserAttentionHotkey = 0x00
## 0x17 is SCAN_ESC
DetectRetailUserAttentionHotkeyCode = 0x17
## Enable OEM Setup App launch in Retail ##
EnableOEMSetupAppInRetail = 0x0


## LogFs partition
## NOTE: Ensure logfs bin is flashed from /Tools/binaries ##
EnableLogFsSyncInRetail = 0x1

## ShmBridge Memory Size
ShmBridgememSize = 0xA00000

##  Multithreading options
EnableMultiThreading = 1
# Keep the following number of cores active, including the boot core
# For Early presilicon stage, this cna be set to 1 since we want to enable 
# 1 core ie boot core
EarlyInitCoreCnt = 2

## Get TZ App Logs ##
EnableUefiSecAppDebugLogDump = 0x0

## Allow Non Persistent Varialbes in Retail ##
## NOTE: Recommend disabling feature for Retail devices
AllowNonPersistentVarsInRetail = 0x1

# Initialize Display panel in its own thread to run in parallel to booting
EnableDisplayThread = 0x1

# Using imagefv to load display logo
EnableDisplayImageFv = 0x1

## Dynamic UART Log Buffer Size
## Refer to QcomPkg/Docs/UefiLogBufferSizeConfigReadme.txt for usage
#UARTLogBufferSize = 0x19000

#DDRInfoDxe EnvDxe event callback flag
DDRInfoNotifyFlag = 0x0

#  FV Decompression on multicore option
#  Value is 0 for early presilicon stage
EnableMultiCoreFvDecompression = 1

## Enable/Disable Variable Policy Engine ##
EnableVariablePolicyEngine = 0

## Allow individual ACPI tables loading ## 
EnableACPIFallback = 0x0

## Address to get Value of DRAM clock period MCCC_CLK_PERIOD
DRAM_CLK_PERIOD_ADDR = 0x240BA050
## NOTE: Do not remove last newline, required by parser ##

