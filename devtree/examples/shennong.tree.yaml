  deps:
  - pmic
  soft_deps:
  - persistent_log
  notes: CDC reboot bootloader 已实机成功；system/recovery 目标未在本轮逐项验证。
- id: usb_msc
  name: USB MSC / 共享 RAM 导出
  group: usb
  driver: UsbFunctions / stock UsbDevice
  deps:
  - usb_stock_replay
  - logfs_partition
  - readonly_storage
  notes: Windows 挂载共享 RAM，98 / 131333 字节文件主机 SHA256 校验通过；定时回 CDC 后同一文件 CRC 和 NSH 再执行通过。
- id: usb_cdc
  name: USB CDC ACM / cdcshell
  group: usb
  driver: UsbFunctions / stock UsbDevice
  deps:
  - usb_stock_replay
  - ram_log
  notes: COM20：命令、日志、分段上传与回读、Shell NSH 执行通过；512 字节整包回复通过。
- id: ram_disk
  name: 64..8192 MiB FAT32 共享 RAM disk
  group: storage
  driver: UsbRamDisk / RamFileCore / read-only local BlockIo
  deps:
  - usb_stock_replay
  - readonly_storage
  notes: 64 / 128 MiB 实机精确分配，0 / 512 / 1024 / 66048 字节上传 CRC 通过；中断替换保留原文件。CDC 与本地只读文件系统共用一个 backing，MSC 使用同一内存。8192 MiB 仅几何/边界验证，实机大容量受可用内存限制。
- id: log_refresh
  name: QR Log / Refresh Log（待实机）
  group: storage
  driver: FrontPage / BootLogSave
  deps:
  - persistent_log
  - touch_navigation
  notes: QR Log改名，正下方Refresh Log保存当前RAM，成功/失败均有窗口反馈；实际菜单索引和编译IFR通过。 单次手动保存，不周期刷盘；单文件不超512KiB，RAM日志256KiB。
- id: ram_upload
  name: CDC RAM 文件上传
  group: storage
  deps:
  - ram_disk
  - usb_cdc
  notes: 客户端按已知长度读取每个 64 KiB 窗口的 ACK，避免等待 64 KiB 接收缓冲填满；普通命令和长正文沿用原接收路径。相同固件交替上传 4 MiB，旧客户端约 0.49 MiB/s，新客户端约 0.68 MiB/s，提升 40%，CRC 与完整日志帧通过。344.1
    MiB WIM 实测 256.4 秒，平均 1.34 MiB/s，CRC 回读通过。页面上传期间使用最多 16 次 / 4 ms 的应用事件服务，并在页面等待中每 1 ms 服务；上传结束或取消后恢复正常等待。USB 驱动二进制与 30 项源码锁保持不变。
  driver: UsbRamTransfer / RamFileCore
- id: efi_remote_boot
  name: CDC 启动映射 EFI 文件
  group: core
  deps:
  - dxe_core
  - usb_cdc
  notes: 3072 字节 ARM64 EFI 的易失执行标记与返回通过；efi-shell-start/return 保存成功，冷重启后旧快照 154821 字节、CRC 通过。当前候选 PE 完整目录、WIM CRC 和四个启动文件列表通过；PE 后重启回 Android，日志 seq=100、156133 字节，最后保存点为进入 Shell 前的 efi-shell-start，没有对应返回或具体错误码。
  driver: UsbRemoteCommands / FrontPage RemoteControl
