  notes: b323 retained SMEM135 chip557 valid1；包装安装，原厂Device Error回退verified ABL cache成功。 板号回退不等于ADC测量恢复；247 OEM行/16 shennong行范围保护保留。
- id: usb_stream_handoff
  name: USB SID40 原厂上下文接管
  group: usb
  driver: UsbStockReplayDxe / b323
  deps:
  - usb_smmu
  - usb_config
  patch:
    kind: source
    ref: AndromedaPkg/Driver/UsbStockReplayDxe/StockDmaMap.h
    enabled: true
    note: 仅退休经启动快照、独占原厂USB0/bypass/idle/identity DMA/全表稳定核验的旧精确SID40。
  notes: b325旧slot4退休、新slot8/CB8验证和Submit/Wait返回成功。 b326保持每次SETUP的DMA身份/归属检查，54场景及真实原厂连接回归通过。
- id: usb_cable_lifecycle
  name: USB 断连 / 模式切换恢复
  group: usb
  driver: UsbStockReplayDxe / b324
  deps:
  - usb_config
  - usb_stream_handoff
  patch:
    kind: source
    ref: AndromedaPkg/Driver/UsbStockReplayDxe/StockTrace.h
    enabled: true
    note: 移除pre-set/re-pin/手工CoreInit/提前RunStop；原厂62AC→60D0/37EC/4A64接管连接状态。
  notes: 多次真实 CDC 拔插自动恢复，含日志接收中断；线缆下降沿取消会话，200 ms 后在 pump 外执行原厂 Stop/StartEx。原文件 CRC 与再次切换通过，锁释放已核对；大文件替换上传中断尚未捕获。当前 USB 上层及 stock 硬件链按源码锁固定。
- id: usb_phy_clock
  name: USB 原厂PIPE/UTMI时钟分支
  group: usb
  driver: UsbConfigDxe 9160 / b326
  deps:
  - usb_config
  - usb_hsphy
  soft_deps:
  - usb_ssphy
  patch:
    kind: source
    ref: AndromedaPkg/Driver/UsbStockReplayDxe/StockTrace.h
    enabled: true
    note: 移除无条件UTMI重放；只观察hs-only/qs08/pipe/phycfg。
  notes: b325 Qs04，b326标准枚举成功；native PIPE/UTMI时序在真实ARM64验证。 本轮不强制时钟重放；PHY有工作枚举路径，SS速率和独立状态仍待证据。
- id: reboot_targets
  name: CDC / 退出页重启到 fastboot
  group: power
